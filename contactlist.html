<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evenraw Admin - Contact List</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <!-- Libraries for export functionality -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    .card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }
    .success-message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #4CAF50;
      color: white;
      padding: 15px 30px;
      border-radius: 5px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      z-index: 10000;
      animation: fadeIn 0.5s, fadeOut 0.5s 4.5s forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; top: 0; }
      to { opacity: 1; top: 20px; }
    }
    @keyframes fadeOut {
      from { opacity: 1; top: 20px; }
      to { opacity: 0; top: 0; }
    }

    .animate-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }
    
    /* Modal styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .modal-container {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      width: 500px;
      max-width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }
    
    .modal-header {
      padding: 1.5rem;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .modal-body {
      padding: 1.5rem;
    }
    
    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid #e5e7eb;
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }
    
    .checkbox-container {
      display: flex;
      align-items: center;
      margin-top: 0.75rem;
    }
    
    .checkbox-container input[type="checkbox"] {
      margin-right: 0.5rem;
    }
    
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #f59e0b;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-gray-100 flex">
  <!-- Sidebar -->
  <aside class="w-64 bg-white shadow-lg h-screen fixed">
    <div class="p-4 text-2xl font-bold text-yellow-500">evenraw</div>
    <nav class="mt-6">
      <ul class="space-y-3 text-gray-700">
        <li class="px-6 py-2 hover:bg-gray-100 cursor-pointer">Users</li>
        <li class="px-6 py-2 hover:bg-gray-100 cursor-pointer">Bookings</li>
        <li class="px-6 py-2 hover:bg-gray-100 cursor-pointer">Portfolio</li>
        <li class="px-6 py-2 hover:bg-gray-100 cursor-pointer">Packages</li>
        <li class="px-6 py-2 hover:bg-gray-100 cursor-pointer">Analysis</li>
        <li class="px-6 py-2 bg-yellow-100 font-semibold cursor-pointer">Contact List</li>
        <li class="px-6 py-2 hover:bg-gray-100 cursor-pointer">Feedbacks</li>
      </ul>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="ml-64 w-full p-6">
    <header class="flex justify-between items-center mb-8">
      <h1 class="text-2xl font-semibold">Contact List</h1>
      <div class="flex items-center gap-4">
        <button id="generateReportBtn" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg flex items-center">
          <i class='bx bx-file bx-sm mr-2'></i> Generate Report
        </button>
        <i class='bx bx-bell text-2xl relative'></i>
        <div class="flex items-center space-x-2">
          <img src="https://i.pravatar.cc/40" class="rounded-full" alt="User">
          <span>John Cena</span>
        </div>
      </div>
    </header>

    <div class="bg-white rounded-lg shadow overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Phone</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Message</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
            </tr>
          </thead>
          <tbody id="contactsTable" class="bg-white divide-y divide-gray-200">
            <!-- Contacts will be loaded here -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Confirmation Modal -->
  <div id="confirmModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-6 w-96 shadow-lg">
      <h2 class="text-xl font-semibold mb-4">Confirm Deletion</h2>
      <p class="mb-6">Are you sure you want to delete this contact submission?</p>
      <div class="flex justify-end gap-3">
        <button id="cancelDeleteBtn" class="px-4 py-2 bg-gray-200 rounded">Cancel</button>
        <button id="confirmDeleteBtn" class="px-4 py-2 bg-red-500 text-white rounded">Delete</button>
      </div>
    </div>
  </div>

  <!-- Report Generation Modal -->
  <div id="reportModal" class="modal-overlay hidden">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="text-lg font-semibold">Generate User Report</h3>
        <button id="closeReportModal" class="text-gray-400 hover:text-gray-600">
          <i class='bx bx-x text-2xl'></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Report Type</label>
          <select id="reportType" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-500">
            <option value="detailed">Detailed User List</option>
            <option value="summary">Summary Report</option>
            <option value="statistics">Contact Statistics</option>
          </select>
        </div>
        
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Format</label>
          <div class="flex space-x-4">
            <label class="inline-flex items-center">
              <input type="radio" name="format" value="pdf" class="h-4 w-4 text-yellow-600 focus:ring-yellow-500" checked>
              <span class="ml-2">PDF</span>
            </label>
            <label class="inline-flex items-center">
              <input type="radio" name="format" value="excel" class="h-4 w-4 text-yellow-600 focus:ring-yellow-500">
              <span class="ml-2">Excel</span>
            </label>
            <label class="inline-flex items-center">
              <input type="radio" name="format" value="csv" class="h-4 w-4 text-yellow-600 focus:ring-yellow-500">
              <span class="ml-2">CSV</span>
            </label>
          </div>
        </div>
        
        <div class="checkbox-container">
          <input type="checkbox" id="includeCharts" class="h-4 w-4 text-yellow-600 focus:ring-yellow-500">
          <label for="includeCharts" class="text-sm font-medium text-gray-700">Include Charts & Graphs</label>
        </div>
      </div>
      <div class="modal-footer">
        <button id="cancelReportBtn" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300">Cancel</button>
        <button id="generateReportNowBtn" class="px-4 py-2 bg-yellow-500 text-white rounded-md hover:bg-yellow-600">Generate Report Now</button>
      </div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="text-center">
      <div class="spinner mb-4"></div>
      <p class="text-gray-700 font-medium">Generating your report...</p>
    </div>
  </div>

  <script>
    // Initialize jsPDF
    const { jsPDF } = window.jspdf;

    let currentDeleteId = null;
    let contactsData = [];
    
    // Load contacts when page loads
    document.addEventListener('DOMContentLoaded', () => {
      loadContacts();
      setupReportModal();
    });
    
    async function loadContacts() {
      try {
        const response = await fetch('get_contacts.php');
        contactsData = await response.json();
        
        const tableBody = document.getElementById('contactsTable');
        tableBody.innerHTML = '';
        
        if (contactsData.length === 0) {
          tableBody.innerHTML = `
            <tr>
              <td colspan="6" class="px-6 py-4 text-center text-gray-500">No contact submissions found</td>
            </tr>
          `;
          return;
        }
        
        contactsData.forEach(contact => {
          const row = document.createElement('tr');
          row.className = 'hover:bg-gray-50';
          row.innerHTML = `
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="flex items-center">
                <div class="ml-4">
                  <div class="text-sm font-medium text-gray-900">${contact.first_name} ${contact.last_name}</div>
                </div>
              </div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm text-gray-900">${contact.email}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm text-gray-900">${contact.phone || 'N/A'}</div>
            </td>
            <td class="px-6 py-4">
              <div class="text-sm text-gray-900 max-w-xs truncate">${contact.message}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm text-gray-500">${new Date(contact.submission_date).toLocaleString()}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
              <button onclick="showDeleteModal(${contact.id})" class="text-red-600 hover:text-red-900">Delete</button>
            </td>
          `;
          tableBody.appendChild(row);
        });
      } catch (error) {
        console.error('Error loading contacts:', error);
        alert('Error loading contacts');
      }
    }
    
    function showDeleteModal(id) {
      currentDeleteId = id;
      document.getElementById('confirmModal').classList.remove('hidden');
    }
    
    document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
      document.getElementById('confirmModal').classList.add('hidden');
      currentDeleteId = null;
    });
    
    document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
      if (!currentDeleteId) return;
      
      try {
        const response = await fetch('delete_contact.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ id: currentDeleteId })
        });
        
        const result = await response.json();
        
        if (result.success) {
          // Show success message
          const successDiv = document.createElement('div');
          successDiv.className = 'success-message';
          successDiv.textContent = 'Contact submission deleted successfully!';
          document.body.appendChild(successDiv);
          
          // Remove message after animation
          setTimeout(() => {
            successDiv.remove();
          }, 5000);
          
          // Reload contacts
          loadContacts();
        } else {
          alert('Error deleting contact: ' + (result.error || 'Unknown error'));
        }
      } catch (error) {
        console.error('Error deleting contact:', error);
        alert('Error deleting contact');
      } finally {
        document.getElementById('confirmModal').classList.add('hidden');
        currentDeleteId = null;
      }
    });
    
    // Report generation functionality
    function setupReportModal() {
      const generateReportBtn = document.getElementById('generateReportBtn');
      const reportModal = document.getElementById('reportModal');
      const closeReportModal = document.getElementById('closeReportModal');
      const cancelReportBtn = document.getElementById('cancelReportBtn');
      const generateReportNowBtn = document.getElementById('generateReportNowBtn');
      const loadingOverlay = document.getElementById('loadingOverlay');
      
      // Open modal
      generateReportBtn.addEventListener('click', () => {
        reportModal.classList.remove('hidden');
      });
      
      // Close modal
      const closeModal = () => {
        reportModal.classList.add('hidden');
      };
      
      closeReportModal.addEventListener('click', closeModal);
      cancelReportBtn.addEventListener('click', closeModal);
      
      // Generate report
      generateReportNowBtn.addEventListener('click', () => {
        const reportType = document.getElementById('reportType').value;
        const format = document.querySelector('input[name="format"]:checked').value;
        const includeCharts = document.getElementById('includeCharts').checked;
        
        closeModal();
        loadingOverlay.classList.remove('hidden');
        
        // Simulate processing time
        setTimeout(() => {
          generateReport(reportType, format, includeCharts);
          loadingOverlay.classList.add('hidden');
        }, 1500);
      });
    }
    
    function generateReport(reportType, format, includeCharts) {
      switch(format) {
        case 'pdf':
          generatePDFReport(reportType, includeCharts);
          break;
        case 'excel':
          generateExcelReport(reportType);
          break;
        case 'csv':
          generateCSVReport(reportType);
          break;
      }
    }
    
    function generatePDFReport(reportType, includeCharts) {
      const doc = new jsPDF();
      
      // Title based on report type
      let title = "EvenRaw Users Report - Detailed";
      if (reportType === "summary") {
        title = "EvenRaw Users Report - Summary";
      } else if (reportType === "statistics") {
        title = "EvenRaw Users Report - Statistics";
      }
      
      // Title
      doc.setFontSize(20);
      doc.setTextColor(40, 40, 40);
      doc.text(title, 14, 22);
      
      // Date
      doc.setFontSize(12);
      doc.setTextColor(100, 100, 100);
      doc.text(`Generated on: ${new Date().toLocaleString()}`, 14, 30);
      
      // Add some statistics (simulated since we don't have real user data)
      const totalContacts = contactsData.length;
      const withPhone = contactsData.filter(contact => contact.phone && contact.phone !== 'N/A').length;
      const phonePercentage = totalContacts > 0 ? ((withPhone / totalContacts) * 100).toFixed(1) : 0;
      
      // Statistics table
      const statsData = [
        ['Total Contacts', totalContacts],
        ['With Phone', `${withPhone} (${phonePercentage}%)`]
      ];
      
      doc.autoTable({
        body: statsData,
        startY: 40,
        theme: 'grid',
        styles: { fontSize: 12, cellPadding: 6 },
        headStyles: { fillColor: [245, 158, 11] } // yellow-500
      });
      
      // Add spacing
      const statsEndY = doc.lastAutoTable.finalY + 10;
      doc.setFontSize(16);
      doc.setTextColor(40, 40, 40);
      doc.text('Contact Details', 14, statsEndY);
      
      // Main data table
      const tableColumn = ["ID", "Name", "Email", "Phone", "Message", "Date"];
      const tableRows = [];
      
      contactsData.forEach((contact, index) => {
        const contactData = [
          index + 1,
          `${contact.first_name} ${contact.last_name}`,
          contact.email,
          contact.phone || 'N/A',
          contact.message.length > 30 ? contact.message.substring(0, 30) + '...' : contact.message,
          new Date(contact.submission_date).toLocaleDateString()
        ];
        tableRows.push(contactData);
      });
      
      doc.autoTable({
        head: [tableColumn],
        body: tableRows,
        startY: statsEndY + 10,
        theme: 'grid',
        styles: { fontSize: 9, cellPadding: 3 },
        headStyles: { fillColor: [245, 158, 11] } // yellow-500
      });
      
      // Footer
      const finalY = doc.lastAutoTable.finalY + 15;
      doc.setFontSize(10);
      doc.setTextColor(100, 100, 100);
      
      // Add "Report generated by: System Administrator"
      doc.text('Report generated by: System Administrator', 14, finalY);
      
      // Add "EvenRaw User Management System" on the next line
      doc.text('EvenRaw User Management System', 14, finalY + 5);
      
      // Save the PDF
      doc.save('evenraw-contacts-report.pdf');
      
      // Show success message
      showSuccessMessage('PDF report generated successfully!');
    }
    
    function generateExcelReport(reportType) {
      // Prepare data for Excel
      const data = contactsData.map((contact, index) => ({
        'ID': index + 1,
        'First Name': contact.first_name,
        'Last Name': contact.last_name,
        'Email': contact.email,
        'Phone': contact.phone || 'N/A',
        'Message': contact.message,
        'Date': new Date(contact.submission_date).toLocaleString()
      }));
      
      // Create worksheet
      const worksheet = XLSX.utils.json_to_sheet(data);
      
      // Create workbook
      const workbook = XLSX.utils.book_new();
      
      // Add statistics sheet if needed
      if (reportType === 'statistics' || reportType === 'summary') {
        const statsData = [
          ['Metric', 'Value'],
          ['Total Contacts', contactsData.length],
          ['With Phone', contactsData.filter(contact => contact.phone && contact.phone !== 'N/A').length]
        ];
        const statsSheet = XLSX.utils.aoa_to_sheet(statsData);
        XLSX.utils.book_append_sheet(workbook, statsSheet, 'Statistics');
      }
      
      XLSX.utils.book_append_sheet(workbook, worksheet, 'Contacts');
      
      // Generate Excel file and download
      XLSX.writeFile(workbook, 'evenraw-contacts-report.xlsx');
      
      // Show success message
      showSuccessMessage('Excel report generated successfully!');
    }
    
    function generateCSVReport(reportType) {
      // Create CSV content
      let csvContent = 'ID,First Name,Last Name,Email,Phone,Message,Date\n';
      
      contactsData.forEach((contact, index) => {
        const row = [
          index + 1,
          `"${contact.first_name}"`,
          `"${contact.last_name}"`,
          `"${contact.email}"`,
          `"${contact.phone || 'N/A'}"`,
          `"${contact.message.replace(/"/g, '""')}"`,
          `"${new Date(contact.submission_date).toLocaleString()}"`
        ].join(',');
        
        csvContent += row + '\n';
      });
      
      // Create download link
      const encodedUri = encodeURI('data:text/csv;charset=utf-8,' + csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', 'evenraw-contacts-report.csv');
      document.body.appendChild(link);
      
      // Trigger download
      link.click();
      
      // Clean up
      document.body.removeChild(link);
      
      // Show success message
      showSuccessMessage('CSV report generated successfully!');
    }
    
    function showSuccessMessage(message) {
      const successDiv = document.createElement('div');
      successDiv.className = 'success-message';
      successDiv.textContent = message;
      document.body.appendChild(successDiv);
      
      // Remove message after animation
      setTimeout(() => {
        successDiv.remove();
      }, 5000);
    }
  </script>
</body>
</html>
